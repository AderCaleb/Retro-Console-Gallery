<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Author: Caleb Ader | Date: 10/19/2026 -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Console Gallery</title>

    <!-- Links (styles and script sheets) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="/css/styles.css">

    <script src="js/script.js" defer></script>

<body>

    <!-- Header -->
    <header>
        <h1>Retro Game Consoles</h1>
    </header>

    <!-- Load new consoles -->
    <button type="button" id="loadCon">Load Consoles</button>

    <!-- Summary of consoles -->
    <div>
        <p id="summary"></p>
    </div>

    <!-- Console cards -->
    <div class="row" id="cards">

    </div>

    <!-- Error messages -->
    <p id="errorMessage"></p>

</body>

</html>
